<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Premium - BOMIDI | SOLOHOUR</title>
    <style>
        /* 弹窗内容区样式，确保输入框整齐 */
.modal-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}
.modal-item input {
    padding: 5px;
    border: 1px solid #ddd;
    border-radius: 4px;
}
        :root { --bg: #f9f9f9; --card: #ffffff; --primary: #1a1a1a; --accent: #ff6b00; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; }
        
        /* 顶部风格 */
        header { background: white; padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee; }
        header h1 { font-size: 1.8rem; letter-spacing: -1px; margin-bottom: 10px; }

        /* 高级网格：像展示柜一样排列 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; padding: 25px; max-width: 1200px; margin: auto; }
        
        /* 卡片：模仿高端电商的圆角和阴影 */
        .card { background: var(--card); border-radius: 20px; padding: 20px; transition: transform 0.3s ease, box-shadow 0.3s ease; border: 1px solid #f0f0f0; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 15px; }
        
        /* 输入与按钮 */
        .input-note { width: 100%; border: 1px solid #eee; padding: 10px; border-radius: 10px; margin: 10px 0; background: #fcfcfc; }
        .counter { display: flex; align-items: center; background: #f0f0f0; border-radius: 12px; overflow: hidden; }
        .counter button { border: none; background: #e0e0e0; padding: 12px 20px; cursor: pointer; font-weight: bold; }
        .counter input { width: 100%; border: none; background: transparent; text-align: center; font-weight: bold; }

        /* 底部悬浮条：类似你想要的专业网站布局 */
        .footer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; background: var(--primary); color: white; padding: 15px 30px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .btn-copy { background: var(--accent); color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header><h1>BOMIDI | SOLOHOUR</h1></header>

<main class="grid" id="catalog"></main>

<div class="footer">
    <span id="totalPrice" style="font-weight:bold; font-size:1.1rem;">Total: $0.00</span>
    <button class="btn-copy" onclick="openModal()">📋 Confirmar Pedido</button>
</div>

<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999; justify-content:center; align-items:center;">
    <div style="background:white; width:90%; max-width:400px; padding:25px; border-radius:25px;">
        <h3>📝 Resumen del Pedido</h3>
        <div id="orderList" style="margin: 20px 0; max-height: 300px; overflow-y: auto; font-size: 0.95rem; line-height: 1.6;"></div>
        <button onclick="copyToClipboard()" style="width:100%; padding:15px; background:var(--accent); color:white; border:none; border-radius:15px; font-weight:bold;">✅ Copiar Información</button>
    </div>
</div>

<script>
    let allProducts = [], cart = {}, notes = {};

    fetch('BOMIDI,SOLOHOUR.json').then(res => res.json()).then(data => { allProducts = data; render(); });

    function render() {
        document.getElementById('catalog').innerHTML = allProducts.map(i => `
            <div class="card">
                <img src="${i.Imagen_Path}" onerror="this.src='https://via.placeholder.com/150'">
                <div style="font-size:0.85rem; height:3em; overflow:hidden;">${i.PRODUCTO}</div>
                <input type="text" placeholder="Nota..." onchange="notes['${i.PRODUCTO}']=this.value" style="margin:8px 0; padding:5px;">
                <div class="counter">
                    <button onclick="update('${i.PRODUCTO}', -1)">-</button>
                    <input type="number" id="q-${i.PRODUCTO}" value="${cart[i.PRODUCTO]||0}" onchange="cart['${i.PRODUCTO}']=parseInt(this.value)||0; updateUI();">
                    <button onclick="update('${i.PRODUCTO}', 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    function update(name, val) {
        cart[name] = Math.max(0, (cart[name]||0) + val);
        document.getElementById('q-'+name).value = cart[name];
        updateUI();
    }

    function updateUI() {
        let total = 0;
        allProducts.forEach(i => total += (cart[i.PRODUCTO]||0) * (parseFloat(i['Precio ( USD )'])||0));
        document.getElementById('totalPrice').innerText = 'Total: $' + total.toFixed(2);
    }

    // 核心改进：弹窗内支持修改
    function openModal() {
        let listHtml = "";
        let hasItems = false;
        for(let n in cart) {
            if(cart[n] > 0) {
                hasItems = true;
                listHtml += `
                    <div class="modal-item">
                        <div style="flex:1; font-size:0.8rem;">${n}</div>
                        <input type="number" value="${cart[n]}" style="width:50px;" onchange="cart['${n}']=parseInt(this.value); updateUI();">
                        <input type="text" value="${notes[n]||''}" placeholder="Nota" onchange="notes['${n}']=this.value">
                    </div>
                `;
            }
        }
        document.getElementById('orderList').innerHTML = hasItems ? listHtml : "Carrito vacío";
        document.getElementById('modal').style.display = 'flex';
    }

    function copyToClipboard() {
        // 生成最终订单文本
        let msg = "📝 NUEVO PEDIDO \n--------------------------\n";
        let totalMoney = 0;
        let idx = 1;
        for (let name in cart) {
            if (cart[name] > 0) {
                const p = allProducts.find(x => x.PRODUCTO === name);
                const sub = cart[name] * (parseFloat(p['Precio ( USD )'])||0);
                totalMoney += sub;
                msg += `*item ${idx}.* *${name}*\nCant: ${cart[name]} | Sub: *$${sub.toFixed(2)}*\n`;
                if (notes[name]) msg += `   └─ 📌 Nota: ${notes[name]}\n`;
                msg += "--------------------------\n";
                idx++;
            }
        }
        msg += `\n📝 *TOTAL PEDIDO: $${totalMoney.toFixed(2)}*`;
        
        navigator.clipboard.writeText(msg).then(() => {
            alert("✅ ¡Pedido copiado!");
            document.getElementById('modal').style.display = 'none';
        });
    }
</script>
</body>
</html>
